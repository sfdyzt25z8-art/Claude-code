name: AIVideoGenerator
options:
  bundleIdPrefix: com.aivideogenerator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:
  AIVideoGenerator:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AIVideoGenerator
    resources:
      - path: Resources
        optional: true
    info:
      path: Sources/AIVideoGenerator/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "AI Video Generator uses your camera to let you record clips and thumbnails to include in your projects."
        NSMicrophoneUsageDescription: "AI Video Generator uses your microphone to record narration for your videos."
        NSPhotoLibraryUsageDescription: "AI Video Generator saves generated videos and thumbnails to your Photos library."
        NSPhotoLibraryAddUsageDescription: "AI Video Generator saves generated videos and thumbnails to your Photos library."
        NSSpeechRecognitionUsageDescription: "AI Video Generator uses speech recognition to generate automatic captions from narration."
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Sources/AIVideoGenerator/App/AIVideoGenerator.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.aivideogenerator.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivideogenerator.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies: []

  AIVideoGeneratorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/AIVideoGeneratorTests
    dependencies:
      - target: AIVideoGenerator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivideogenerator.tests

schemes:
  AIVideoGenerator:
    build:
      targets:
        AIVideoGenerator: all
        AIVideoGeneratorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIVideoGeneratorTests
    archive:
      config: Release
