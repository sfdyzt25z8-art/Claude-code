name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ceo-empire/**"
      - "halftime-snack-preorder/**"
      - "velocity-rush/**"
      - "focusflow/**"
      - "time-rift/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight runs finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ceo-empire/package-lock.json
            velocity-rush/package-lock.json
            focusflow/package-lock.json

      - name: Build CEO Empire
        working-directory: ceo-empire
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
        env:
          # Optional: set these as repository secrets to build with a real Firebase
          # project. Left unset, the app builds and runs fine in local Guest Mode.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build Velocity Rush
        working-directory: velocity-rush
        run: |
          npm ci
          npm run build

      - name: Build FocusFlow
        working-directory: focusflow
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          # Optional: set these as repository secrets to connect a real AI provider.
          # Left unset, the AI Coach builds and runs fine with its local fallback.
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_AI_MODEL: ${{ secrets.VITE_AI_MODEL }}

      # CEO Empire is the root site; other apps are published under their own subpath.
      - name: Assemble combined Pages site
        run: |
          mkdir -p site/halftime-snack-preorder site/velocity-rush site/focusflow site/time-rift
          cp -r ceo-empire/dist/. site/
          cp halftime-snack-preorder/index.html halftime-snack-preorder/app.js halftime-snack-preorder/style.css site/halftime-snack-preorder/
          cp -r velocity-rush/dist/. site/velocity-rush/
          cp -r focusflow/dist/. site/focusflow/
          cp -r time-rift/index.html time-rift/css time-rift/js site/time-rift/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
