<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e27" />
    <meta name="description" content="Velocity Rush — a modern arcade car racing game. Race, drift, upgrade, and customize your way to the top." />
    <title>Velocity Rush</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05070f;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas { outline: none; }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #7fdcff;
        background: radial-gradient(circle at 50% 30%, #12183a 0%, #05070f 70%);
        font-size: 1.1rem;
        letter-spacing: 0.08em;
        z-index: 0;
      }
      #boot-fallback strong {
        font-size: 2rem;
        background: linear-gradient(90deg, #ff5f6d, #ffc371, #7fdcff, #4facfe);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-fallback">
        <strong>VELOCITY RUSH</strong>
        <span>Loading engine…</span>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
