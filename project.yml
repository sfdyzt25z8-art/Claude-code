name: AIVideoGenerator
options:
  bundleIdPrefix: com.aivideogenerator
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AIVideoGenerator:
    type: application
    platform: iOS
    sources:
      - path: AIVideoGenerator
    resources:
      - path: AIVideoGenerator/Resources
    info:
      path: AIVideoGenerator/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "AI Video Generator uses the camera to let you capture footage to remix or use as a reference for AI generation."
        NSMicrophoneUsageDescription: "AI Video Generator uses the microphone to record narration for your videos."
        NSPhotoLibraryUsageDescription: "AI Video Generator needs access to your photo library to import media and save your finished videos."
        NSPhotoLibraryAddUsageDescription: "AI Video Generator saves generated and edited videos to your photo library."
        NSSpeechRecognitionUsageDescription: "AI Video Generator uses speech recognition to generate automatic captions."
        NSUserTrackingUsageDescription: "AI Video Generator does not track you across apps. This permission is unused unless enabled in a future release."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: AIVideoGenerator/Resources/AIVideoGenerator.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.aivideogenerator.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivideogenerator.app
        PRODUCT_NAME: AI Video Generator
        GENERATE_INFOPLIST_FILE: NO
    dependencies: []

  AIVideoGeneratorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIVideoGeneratorTests
    dependencies:
      - target: AIVideoGenerator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aivideogenerator.app.tests

schemes:
  AIVideoGenerator:
    build:
      targets:
        AIVideoGenerator: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIVideoGeneratorTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
